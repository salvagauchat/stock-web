<div class="sl-dialog-content">
  <div class="sl-dialog-title">{{ esEdicion ? 'Editar producto' : 'Nuevo producto' }}</div>

  <div class="sl-field">
    <label for="nombre">Nombre</label>
    <input id="nombre" class="sl-input" [(ngModel)]="nombre" name="nombre" required />
  </div>

  <div class="sl-field">
    <label for="marca">Marca</label>
    <input id="marca" class="sl-input" [(ngModel)]="marca" name="marca" />
  </div>

  <div class="sl-field">
    <label for="descripcion">Descripción</label>
    <input id="descripcion" class="sl-input" [(ngModel)]="descripcion" name="descripcion" />
  </div>

  <div class="sl-field-row">
    <div class="sl-field">
      <label for="categoria">Categoría</label>
      <select id="categoria" class="sl-input" [(ngModel)]="categoriaId" name="categoria">
        <option [ngValue]="null">Sin categoría</option>
        @for (cat of categorias; track cat.id) {
          <option [ngValue]="cat.id">{{ cat.nombre }}</option>
        }
      </select>
    </div>
    <div class="sl-field">
      <label for="proveedor">Proveedor</label>
      <select id="proveedor" class="sl-input" [(ngModel)]="proveedorId" name="proveedor">
        <option [ngValue]="null">Sin proveedor</option>
        @for (prov of proveedores; track prov.id) {
          <option [ngValue]="prov.id">{{ prov.nombre }}</option>
        }
      </select>
    </div>
  </div>

  <div class="sl-field-row">
    <div class="sl-field">
      <label for="precioCosto">Precio costo</label>
      <input id="precioCosto" class="sl-input" type="number" [(ngModel)]="precioCosto" name="precioCosto" />
    </div>
    <div class="sl-field">
      <label for="precioVenta">Precio venta</label>
      <input id="precioVenta" class="sl-input" type="number" [(ngModel)]="precioVenta" name="precioVenta" />
    </div>
  </div>

  <div class="sl-field">
    <label for="stock">Stock {{ esEdicion ? 'actual' : 'inicial' }}</label>
    <input id="stock" class="sl-input" type="number" [(ngModel)]="stock" name="stock" />
  </div>

  @if (error()) {
    <p class="sl-form-error">{{ error() }}</p>
  }

  <div class="sl-dialog-actions">
    <button class="sl-btn sl-btn-secondary" type="button" (click)="cancelar()">Cancelar</button>
    <button class="sl-btn sl-btn-primary" type="button" [disabled]="guardando()" (click)="guardar()">
      {{ guardando() ? 'Guardando...' : 'Guardar' }}
    </button>
  </div>
</div>

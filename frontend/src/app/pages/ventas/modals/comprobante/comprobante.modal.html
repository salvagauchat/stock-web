<div class="comprobante-content">
  <div class="comprobante-check"><i class="ph ph-check"></i></div>
  <div class="sl-dialog-title">Venta #{{ venta.id }} registrada</div>
  <div class="sl-dialog-body">{{ cantidadArticulos }} artículos · {{ resumenMedio }}</div>
  <div class="comprobante-total">{{ venta.total | money }}</div>
  <div class="comprobante-actions">
    <button class="sl-btn sl-btn-secondary" type="button" (click)="cerrar()">Cerrar</button>
    <button class="sl-btn sl-btn-primary" type="button" (click)="imprimir()">
      <i class="ph ph-printer"></i>
      Imprimir
    </button>
  </div>
</div>

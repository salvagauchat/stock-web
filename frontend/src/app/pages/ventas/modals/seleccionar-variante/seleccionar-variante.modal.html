<div class="sl-dialog-content">
  <div class="sl-dialog-title">{{ productoNombre }}</div>
  <div class="sl-dialog-body">Elegí la variante que se lleva el cliente.</div>

  <div class="variante-list">
    @for (v of variantes; track v.id) {
      <button class="variante-opt" type="button" (click)="elegir(v)">
        <span class="variante-swatch" [style.background]="swatch(v)"></span>
        <span class="variante-etiqueta">{{ etiqueta(v) }}</span>
        <span class="variante-stock">{{ v.stock_actual }} en stock</span>
      </button>
    }
  </div>

  <div class="sl-dialog-actions">
    <button class="sl-btn sl-btn-secondary" type="button" (click)="cancelar()">Cancelar</button>
  </div>
</div>

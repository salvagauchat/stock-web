<ion-header>
  <ion-toolbar>
    <ion-title>{{ esEdicion ? 'Editar proveedor' : 'Nuevo proveedor' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancelar()">Cerrar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-label position="stacked">Nombre</ion-label>
    <ion-input [(ngModel)]="nombre" name="nombre" required></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="stacked">Teléfono</ion-label>
    <ion-input [(ngModel)]="telefono" name="telefono"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="stacked">Email</ion-label>
    <ion-input type="email" [(ngModel)]="email" name="email"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="stacked">Dirección</ion-label>
    <ion-input [(ngModel)]="direccion" name="direccion"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="stacked">CUIT</ion-label>
    <ion-input [(ngModel)]="cuit" name="cuit"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="stacked">Notas</ion-label>
    <ion-input [(ngModel)]="notas" name="notas"></ion-input>
  </ion-item>

  @if (error()) {
    <ion-text color="danger">
      <p>{{ error() }}</p>
    </ion-text>
  }

  <ion-button expand="block" class="ion-margin-top" (click)="guardar()" [disabled]="guardando()">
    {{ guardando() ? 'Guardando...' : 'Guardar' }}
  </ion-button>
</ion-content>

<div class="sl-dialog-content">
  <div class="sl-dialog-title">{{ esEdicion ? 'Editar proveedor' : 'Nuevo proveedor' }}</div>

  <div class="sl-field">
    <label for="nombre">Nombre</label>
    <input id="nombre" class="sl-input" [(ngModel)]="nombre" name="nombre" required />
  </div>

  <div class="sl-field-row">
    <div class="sl-field">
      <label for="telefono">Teléfono</label>
      <input id="telefono" class="sl-input" [(ngModel)]="telefono" name="telefono" />
    </div>
    <div class="sl-field">
      <label for="email">Email</label>
      <input id="email" class="sl-input" type="email" [(ngModel)]="email" name="email" />
    </div>
  </div>

  <div class="sl-field">
    <label for="direccion">Dirección</label>
    <input id="direccion" class="sl-input" [(ngModel)]="direccion" name="direccion" />
  </div>

  <div class="sl-field">
    <label for="cuit">CUIT</label>
    <input id="cuit" class="sl-input" [(ngModel)]="cuit" name="cuit" />
  </div>

  <div class="sl-field">
    <label for="notas">Notas</label>
    <input id="notas" class="sl-input" [(ngModel)]="notas" name="notas" />
  </div>

  @if (error()) {
    <p class="sl-form-error">{{ error() }}</p>
  }

  <div class="sl-dialog-actions">
    <button class="sl-btn sl-btn-secondary" type="button" (click)="cancelar()">Cancelar</button>
    <button class="sl-btn sl-btn-primary" type="button" [disabled]="guardando()" (click)="guardar()">
      {{ guardando() ? 'Guardando...' : 'Guardar' }}
    </button>
  </div>
</div>

<div class="sl-dialog-content">
  <div class="sl-dialog-title">{{ esEdicion ? 'Editar categoría' : 'Nueva categoría' }}</div>

  <div class="sl-field">
    <label for="nombre">Nombre</label>
    <input id="nombre" class="sl-input" [(ngModel)]="nombre" name="nombre" required />
  </div>

  <div class="sl-field">
    <label for="descripcion">Descripción</label>
    <input id="descripcion" class="sl-input" [(ngModel)]="descripcion" name="descripcion" />
  </div>

  <div class="sl-field">
    <label for="icono">Ícono (opcional)</label>
    <input id="icono" class="sl-input" [(ngModel)]="icono" name="icono" placeholder="ph-t-shirt" />
    <p class="sl-field-hint">Nombre de un ícono de Phosphor (phosphoricons.com), sin el prefijo "ph". Ej: ph-t-shirt, ph-coat-hanger.</p>
  </div>

  @if (error()) {
    <p class="sl-form-error">{{ error() }}</p>
  }

  <div class="sl-dialog-actions">
    <button class="sl-btn sl-btn-secondary" type="button" (click)="cancelar()">Cancelar</button>
    <button class="sl-btn sl-btn-primary" type="button" [disabled]="guardando()" (click)="guardar()">
      {{ guardando() ? 'Guardando...' : 'Guardar' }}
    </button>
  </div>
</div>

<div class="sl-dialog-content">
  <div class="sl-dialog-title">{{ esEdicion ? 'Editar gasto' : 'Nuevo gasto' }}</div>

  <div class="sl-field">
    <label for="descripcion">Descripción</label>
    <input id="descripcion" class="sl-input" [(ngModel)]="descripcion" name="descripcion" required />
  </div>

  <div class="sl-field-row">
    <div class="sl-field">
      <label for="categoria">Categoría</label>
      <select id="categoria" class="sl-input" [(ngModel)]="categoriaGastoId" name="categoria">
        <option [ngValue]="null" disabled>Elegir categoría</option>
        @for (cat of categorias; track cat.id) {
          <option [ngValue]="cat.id">{{ cat.nombre }} ({{ cat.tipo === 'CORRIENTE' ? 'corriente' : 'no corriente' }})</option>
        }
      </select>
    </div>
    <div class="sl-field">
      <label for="monto">Monto</label>
      <input id="monto" class="sl-input" type="number" min="0" [(ngModel)]="monto" name="monto" />
    </div>
  </div>

  <div class="sl-field-row">
    <div class="sl-field">
      <label for="medioPago">Medio de pago</label>
      <select id="medioPago" class="sl-input" [(ngModel)]="medioPago" name="medioPago">
        @for (medio of mediosPago; track medio) {
          <option [ngValue]="medio">{{ medio }}</option>
        }
      </select>
    </div>
    <div class="sl-field">
      <label for="proveedor">Proveedor (opcional)</label>
      <select id="proveedor" class="sl-input" [(ngModel)]="proveedorId" name="proveedor">
        <option [ngValue]="null">Sin proveedor</option>
        @for (prov of proveedores; track prov.id) {
          <option [ngValue]="prov.id">{{ prov.nombre }}</option>
        }
      </select>
    </div>
  </div>

  <div class="sl-field">
    <label for="comprobante">N° de comprobante</label>
    <input id="comprobante" class="sl-input" [(ngModel)]="comprobanteNumero" name="comprobanteNumero" />
  </div>

  <div class="sl-field">
    <label for="notas">Notas</label>
    <input id="notas" class="sl-input" [(ngModel)]="notas" name="notas" />
  </div>

  @if (error()) {
    <p class="sl-form-error">{{ error() }}</p>
  }

  <div class="sl-dialog-actions">
    <button class="sl-btn sl-btn-secondary" type="button" (click)="cancelar()">Cancelar</button>
    <button class="sl-btn sl-btn-primary" type="button" [disabled]="guardando()" (click)="guardar()">
      {{ guardando() ? 'Guardando...' : 'Guardar' }}
    </button>
  </div>
</div>

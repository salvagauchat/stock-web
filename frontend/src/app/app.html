@if (auth.autenticado()) {
  <ion-app>
    <div class="shell">
      @if (!sidebarAbierto()) {
        <button class="sidebar-toggle" type="button" (click)="toggleSidebar()" aria-label="Abrir menú">
          <i class="ph ph-list"></i>
        </button>
      }

      @if (sidebarAbierto()) {
        <div class="sidebar-backdrop" (click)="cerrarSidebar()"></div>
      }

      <aside class="sidebar" [class.abierto]="sidebarAbierto()">
        <div class="sidebar-brand">
          <img class="sidebar-brand-logo" src="logo-mark.png" alt="GRES" />
        </div>

        <div class="sidebar-group-label">Operación</div>
        <a class="sidebar-item" routerLink="/ventas" routerLinkActive="active">
          <i class="ph ph-shopping-cart"></i>
          <span>Ventas</span>
        </a>

        <a class="sidebar-item" [class.active]="stockActivo()" routerLink="/stock">
          <i class="ph ph-stack"></i>
          <span>Stock</span>
          <i class="ph ph-caret-down sidebar-item-caret"></i>
        </a>
        <div class="sidebar-submenu">
          <a routerLink="/stock" routerLinkActive="active">Productos</a>
          <a routerLink="/categorias" routerLinkActive="active">Categorías</a>
          <a routerLink="/proveedores" routerLinkActive="active">Proveedores</a>
        </div>

        <div class="sidebar-group-label">Finanzas</div>
        <a class="sidebar-item" routerLink="/gastos" routerLinkActive="active">
          <i class="ph ph-wallet"></i>
          <span>Gastos</span>
        </a>
        <a class="sidebar-item" routerLink="/balance" routerLinkActive="active">
          <i class="ph ph-chart-line"></i>
          <span>Balance</span>
        </a>

        <div class="sidebar-spacer"></div>

        <div class="sidebar-user">
          <div class="avatar">{{ iniciales() }}</div>
          <span class="sidebar-user-name">{{ auth.usuario()?.nombre }}</span>
          <button class="logout-btn" type="button" (click)="logout()" aria-label="Cerrar sesión">
            <i class="ph ph-sign-out"></i>
          </button>
        </div>

        <div class="sidebar-footer">GauchasitoDev</div>
      </aside>

      <div class="content-area">
        <ion-router-outlet></ion-router-outlet>
      </div>
    </div>
  </ion-app>
} @else {
  <ion-app>
    <ion-router-outlet></ion-router-outlet>
  </ion-app>
}

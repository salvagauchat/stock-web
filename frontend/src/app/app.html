@if (auth.autenticado()) {
  <ion-app>
    <ion-split-pane content-id="main-content" when="md">
      <ion-menu content-id="main-content" type="overlay">
        <ion-header>
          <ion-toolbar>
            <ion-title class="brand-title">StockLocal</ion-title>
          </ion-toolbar>
        </ion-header>
        <ion-content>
          <ion-list lines="none">
            <ion-accordion-group value="ventas">
              <ion-accordion value="ventas">
                <ion-item slot="header" button detail="false">
                  <ion-label>Ventas</ion-label>
                </ion-item>
                <ion-list slot="content">
                  <ion-item routerLink="/ventas" routerLinkActive="menu-activo" button detail="false">Vender</ion-item>
                  <ion-item routerLink="/historial" routerLinkActive="menu-activo" button detail="false">Historial</ion-item>
                </ion-list>
              </ion-accordion>

              <ion-accordion value="stock">
                <ion-item slot="header" button detail="false">
                  <ion-label>Stock</ion-label>
                </ion-item>
                <ion-list slot="content">
                  <ion-item routerLink="/stock" routerLinkActive="menu-activo" button detail="false">Productos</ion-item>
                  <ion-item routerLink="/categorias" routerLinkActive="menu-activo" button detail="false">Categorías</ion-item>
                  <ion-item routerLink="/proveedores" routerLinkActive="menu-activo" button detail="false">Proveedores</ion-item>
                </ion-list>
              </ion-accordion>
            </ion-accordion-group>

            <ion-item routerLink="/gastos" routerLinkActive="menu-activo" button detail="false">Gastos</ion-item>
            <ion-item routerLink="/balance" routerLinkActive="menu-activo" button detail="false">Balance</ion-item>
          </ion-list>
        </ion-content>
      </ion-menu>

      <ion-router-outlet id="main-content"></ion-router-outlet>
    </ion-split-pane>
  </ion-app>
} @else {
  <ion-app>
    <ion-router-outlet></ion-router-outlet>
  </ion-app>
}
